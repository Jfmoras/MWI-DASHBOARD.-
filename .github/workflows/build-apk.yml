name: Build MWI Dashboard APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.Q_E_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret Q_E_KEY_STORE_BASE64 is empty or not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/keystore.jks
          echo "Keystore written: $(stat -c %s app/keystore.jks) bytes"
      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.Q_E_KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.Q_E_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.Q_E_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MWI-Dashboard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
